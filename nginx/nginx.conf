user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 128k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream cms {
    zone cms 64k;
    server app:3000 resolve;
  }
  log_format structured escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
  access_log /var/log/nginx/access.log structured;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:8443$request_uri;
  }
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    location / {
      proxy_pass http://cms;
      proxy_http_version 1.1;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-XSS-Protection;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
  # Not published to the host. Exporter is the only consumer.
  server {
    listen 8080;
    location = /stub_status { stub_status; access_log off; }
    location = /healthz { access_log off; return 200 'ok'; }
    location / { return 404; }
  }
}
